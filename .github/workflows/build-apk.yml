name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build APK inside Docker
      working-directory: android
      run: |
        docker run --rm \
          -v "${{ github.workspace }}/android:/app" \
          kivy/buildozer:latest \
          python3 /app/patch_and_build.py

    - name: Fix permissions
      if: always()
      run: sudo chmod -R 755 android/bin/ || true

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: android/bin/*.apk
        retention-days: 30
