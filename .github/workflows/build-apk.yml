name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (Docker)
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Pull Buildozer Docker image
      run: docker pull kivy/buildozer:latest

    - name: Build APK inside Docker
      working-directory: android
      run: |
        docker run --rm \
          -v "${{ github.workspace }}/android:/home/user/hostdir" \
          kivy/buildozer:latest \
          bash -c "cp -r /home/user/hostdir/* . && buildozer -v android debug"

    - name: Fix permissions (Docker writes as root)
      if: always()
      run: |
        sudo chown -R runner:runner android/bin/ || true
        ls -lh android/bin/*.apk 2>/dev/null || echo "No APK found"

    - name: Upload APK artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: android/bin/*.apk
        retention-days: 30

    - name: Show Buildozer log on failure
      if: failure()
      run: |
        echo "=== Buildozer log ==="
        cat android/.buildozer/logs/*.log 2>/dev/null || true
        echo "=== Last 100 lines of build output ==="
        tail -100 android/buildozer_output.log 2>/dev/null || true