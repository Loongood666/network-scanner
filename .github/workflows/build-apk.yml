name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          python3-pip python3-dev python3-venv \
          build-essential curl wget unzip \
          libbz2-dev libncurses5-dev libffi-dev \
          libreadline-dev libsqlite3-dev \
          zlib1g-dev liblzma-dev autoconf libtool pkg-config \
          python3-setuptools

    - name: Set up Android SDK
      run: |
        mkdir -p $HOME/android-sdk/cmdline-tools
        cd $HOME/android-sdk/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mv cmdline-tools latest
        echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

    - name: Install Android SDK components
      run: |
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3"
        sdkmanager --update
      env:
        ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        ANDROID_HOME: ${{ env.ANDROID_HOME }}

    - name: Install Cython and Buildozer
      run: |
        pip3 install --user cython==0.29.19
        pip3 install --user buildozer
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Update buildozer.spec to use existing SDK
      working-directory: android
      run: |
        sed -i 's/^android.sdk = .*/android.sdk = 30/' buildozer.spec
        echo "" >> buildozer.spec
        echo "# Use existing SDK" >> buildozer.spec
        echo "android.sdk_path = $HOME/android-sdk" >> buildozer.spec

    - name: Build APK
      working-directory: android
      timeout-minutes: 60
      env:
        ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        ANDROID_HOME: ${{ env.ANDROID_HOME }}
      run: |
        buildozer -v android debug

    - name: Upload APK artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: android/bin/*.apk
        retention-days: 30

    - name: Show build log on failure
      if: failure()
      working-directory: android
      run: |
        echo "=== buildozer version ==="
        buildozer --version || true
        echo "=== Android SDK contents ==="
        ls -la $HOME/android-sdk/ || true
        echo "=== last 200 lines of build output ==="
        tail -200 .buildozer/logs/*.log 2>/dev/null || true
