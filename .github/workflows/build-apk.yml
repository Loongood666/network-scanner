name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build APK inside Docker (auto-answer prompts with yes)
      working-directory: android
      run: |
        docker run --rm \
          -v "${{ github.workspace }}/android:/app" \
          kivy/buildozer:latest \
          bash -c " \
            cd /app && \
            echo 'Auto-answering all prompts...' && \
            yes | buildozer -v android debug \
          "

    - name: Fix permissions (Docker writes as root)
      if: always()
      run: |
        sudo chmod -R 755 android/bin/ || true
        ls -lh android/bin/*.apk 2>/dev/null || echo "No APK found yet"

    - name: Upload APK artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: android/bin/*.apk
        retention-days: 30

    - name: Show build log on failure
      if: failure()
      run: |
        echo "=== Buildozer log ==="
        cat android/.buildozer/logs/*.log 2>/dev/null || true
