name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          python3-pip python3-dev python3-venv \
          build-essential curl wget \
          libbz2-dev libncurses5-dev libffi-dev \
          libreadline-dev libsqlite3-dev \
          zlib1g-dev liblzma-dev autoconf libtool pkg-config \
          python3-setuptools

    - name: Install Cython and Buildozer
      run: |
        pip3 install --user cython==0.29.19
        pip3 install --user buildozer
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Build APK
      working-directory: android
      timeout-minutes: 60
      run: |
        buildozer -v android debug

    - name: Upload APK artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: android/bin/*.apk
        retention-days: 30

    - name: Show build log on failure
      if: failure()
      working-directory: android
      run: |
        echo "=== buildozer __init__.py check_root ==="
        python3 -c "import buildozer; print(buildozer.__file__)" || true
        echo "=== last 100 lines of build output ==="
        tail -100 .buildozer/logs/*.log 2>/dev/null || true
